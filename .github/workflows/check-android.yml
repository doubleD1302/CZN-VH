name: Check Android
on: [push, pull_request]
jobs:
  pc-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r tools/requirements.txt
      - working-directory: tools
        run: python -m unittest test_change_history test_android_sync test_android_sync_ui test_atomic_retry test_app_only_release
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: |
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testDebugUnitTest
